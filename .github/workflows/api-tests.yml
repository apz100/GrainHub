name: API tests

# Runs the GrainBids FastAPI test suite on every push.
# No secrets, no deploy steps — tests only.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  api-tests:
    name: FastAPI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GrainBids/grainbids/apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GrainBids/grainbids/apps/api/requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run FastAPI test suite
        run: python -m pytest -q
