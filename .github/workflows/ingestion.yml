# Scheduled ingestion — PREPARED, NOT ACTIVE.
#
# Design and pricing: docs/decisions/render-cron-proposal.md
# (GitHub Actions = $0 on this public repo; Render Cron Jobs = $2/mo).
#
# The schedule block below is COMMENTED OUT on purpose. Until Adam
# approves and the repo secrets exist, this workflow can only be run
# manually (workflow_dispatch) — and even that will fail until the
# secrets are set. Do not uncomment the schedule as part of a merge
# unless the secrets below are already in place.
#
# To activate (Adam's decision):
#   1. Add repo secrets: DATABASE_URL (Supabase session-pooler URI,
#      same value as Render), NASS_API_KEY, FAS_DATA_GOV_API_KEY.
#   2. Uncomment the schedule block.
#   3. Merge to master (scheduled workflows only run from the
#      default branch).
#
# Times are 08:05 / 15:05 America/Toronto (not :00 — GitHub drops
# queued jobs under top-of-hour load; the timezone field handles DST,
# unlike Render cron which is UTC-only).

name: Scheduled ingestion

on:
  schedule:
    - cron: "5 8 * * *"
      timezone: "America/Toronto"
    - cron: "5 15 * * *"
      timezone: "America/Toronto"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r GrainBids/grainbids/apps/api/requirements.txt
      - working-directory: GrainBids/grainbids/apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          FAS_DATA_GOV_API_KEY: ${{ secrets.FAS_DATA_GOV_API_KEY }}
          APP_ENV: production
          ALLOW_IMPLICIT_ORG: "false"
        run: |
          python -m app.jobs.daily_source_ingestion
          python -m app.jobs.poll_sources
